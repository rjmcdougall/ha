# Midea RS485 ESPHome config — exposes the heat pump as a native HA thermostat
# Copy the components/ directory alongside this file in /config/esphome/

esphome:
  name: midea

esp32:
  board: wemos_d1_mini32
  framework:
    type: arduino

# --- Update these for your network ---
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password


api:
  encryption:
    key: "hdkuWGUju81LwCBr22iOeX0AU4KabxTCu7IGXzTUmZo="

ota:
    - platform: esphome
      password: "3aabfa181ac7f6c594d5fe2ebc74a8aa"

logger:

# -------------------------------------------------------
# External component replaces the old custom component
# -------------------------------------------------------
external_components:
  - source:
      type: local
      path: components

# The library is pulled in automatically by the component,
# but you can also keep it here as a fallback:
# esphome:
#   libraries:
#     - "https://github.com/Bunicutz/ESP32_Midea_RS485.git"

# -------------------------------------------------------
# The component IS the thermostat: a single climate entity
# (mode, target temp, current temp, fan speed, swing) plus
# diagnostic temperature sensors and a few auxiliary toggles.
# -------------------------------------------------------
midea_rs485:
  id: my_midea
  name: "Heat Pump"
  update_interval: 10s
  # Pin defaults match the original bunicutz_AC.h — override if your wiring differs
  di_pin: 16
  ro_pin: 17
  de_pin: 22
  master_id: 0
  slave_id: 0
  master_send_time: 40
  slave_timeout: 100
  # Thermostat setpoint range shown in Home Assistant
  visual:
    min_temperature: 16
    max_temperature: 32
    temperature_step: 1
  # Diagnostic temperature sensors
  t1_temp:
    name: "AC In Air Temp"
  t2a_temp:
    name: "AC Coil A Temp"
  t2b_temp:
    name: "AC Coil B Temp"
  t3_temp:
    name: "AC Outdoor Temp"
  not_responding:
    name: "AC Com State"
  # Auxiliary features with no climate equivalent — wired to the switches below
  aux_heat: ac_aux_heat
  echo_sleep: ac_echo_sleep
  vent: ac_vent
  lock: ac_lock

# -------------------------------------------------------
# Auxiliary toggles (aux heat / sleep / vent / panel lock)
# -------------------------------------------------------
switch:
  - platform: template
    name: "Auxiliary Heat"
    id: ac_aux_heat
    optimistic: true

  - platform: template
    name: "Echo/Sleep"
    id: ac_echo_sleep
    optimistic: true

  - platform: template
    name: "Vent"
    id: ac_vent
    optimistic: true

  - platform: template
    name: "Lock"
    id: ac_lock
    optimistic: true
